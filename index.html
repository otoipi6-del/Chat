<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chat-ai</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Сайдбар (слева) -->
  <div class="sidebar hidden" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <i class="fas fa-robot"></i>
        <span>chat-ai</span>
      </div>
    </div>
    
    <button class="new-chat-btn" id="newChatBtn">
      <i class="fas fa-plus"></i>
      <span>New Chat</span>
    </button>
    
    <div class="chat-history" id="chatHistory">
      <!-- История чатов будет заполняться через JS -->
    </div>

    <div class="sidebar-footer">
      <button class="clear-all-btn" id="clearAllBtn">
        <i class="fas fa-trash-alt"></i>
        <span>Очистить историю</span>
      </button>
    </div>
  </div>

  <!-- Основная область справа -->
  <div class="main-content">
    
    <!-- Шапка -->
    <div class="chat-header">
      <div class="chat-header-left">
        <div class="chat-title">chat-ai</div>
      </div>
      <div class="chat-header-right">
        <select id="providerSelect" class="provider-select">
          <option value="groq">Groq</option>
          <option value="deepseek">DeepSeek</option>
          <option value="openrouter">OpenRouter</option>
        </select>
        <select id="modelSelect" class="provider-select">
          <!-- Заполняется через JS -->
        </select>
        
        <button class="theme-toggle-btn" id="themeToggleBtn" title="Переключить тему">
          <i class="fas fa-moon"></i>
        </button>

        <button class="hamburger-btn" id="openSidebarBtn">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </div>

    <!-- Сообщения -->
    <div class="messages-container" id="messagesContainer">
      <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-icon"><i class="fas fa-robot"></i></div>
        <h1>Здравствуйте!</h1>
        <p>Чем я могу вам помочь?</p>
      </div>
      
      <div class="typing-indicator" id="typingIndicator">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    </div>

    <!-- Поле ввода (КНОПКИ ПОД ТЕКСТОМ) -->
    <div class="input-container">
      <div class="input-box">
        
        <!-- Текстовая область сверху -->
        <textarea class="message-input" id="messageInput" placeholder="Message chat-ai..." rows="1"></textarea>
        
        <!-- Блок с кнопками снизу -->
        <div class="input-actions">
          <input type="file" id="fileInput" style="display: none;">
          <button class="input-icon-btn" title="Attach file" id="attachBtn"><i class="fas fa-paperclip"></i></button>
          
          <div class="right-actions">
            <button class="input-icon-btn" title="Voice input" id="micBtn"><i class="fas fa-microphone"></i></button>
            <button class="send-btn" id="sendButton" disabled>
              <i class="fas fa-paper-plane"></i>
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html-docx-js/dist/html-docx.js"></script>
  <script src="script.js"></script>
</body>
</html>
