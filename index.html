<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chat-ai</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    /* --- Стили для нового интерфейса --- */
    :root {
      --sidebar-width: 260px;
    }
    
    body {
      display: flex;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      background-color: var(--bg-color);
    }

    /* Сайдбар */
    .sidebar {
      width: var(--sidebar-width);
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
      height: 100%;
    }

    /* Скрытие сайдбара (для мобильных или по кнопке) */
    .sidebar.hidden {
      transform: translateX(-100%);
      position: absolute;
      z-index: 1000;
    }

    .sidebar-header {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
    }

    .new-chat-btn {
      margin: 16px;
      padding: 10px 16px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .new-chat-btn:hover {
      background-color: #1a56d6;
    }

    .chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    /* Пункт истории с тремя точками */
    .chat-item-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 4px;
      font-size: 14px;
      transition: background 0.2s;
    }

    .chat-item-wrapper:hover {
      background-color: #e5e7eb;
    }

    .chat-item-wrapper.active {
      background-color: var(--primary-light);
      color: var(--primary);
    }

    .chat-item-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .chat-item-menu {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .chat-item-wrapper:hover .chat-item-menu {
      opacity: 1;
    }

    /* Основная область */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }

    /* Шапка */
    .chat-header {
      padding: 12px 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--bg-color);
    }

    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hamburger-btn {
      background: none;
      border: none;
      font-size: 20px;
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 4px;
    }

    .chat-header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .provider-select {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-size: 14px;
      cursor: pointer;
      outline: none;
    }

    .provider-select:focus {
      border-color: var(--primary);
    }

    /* Контейнер сообщений */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center; /* Центрируем контент по горизонтали */
      background-color: var(--chat-bg);
    }

    .messages-container > * {
      width: 100%;
      max-width: 800px; /* Ограничиваем ширину, чтобы не расползалось */
    }

    /* Приветствие по центру */
    .welcome-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-secondary);
      text-align: center;
      margin-top: -50px; /* Небольшой сдвиг вверх для визуального центра */
    }

    .welcome-icon {
      font-size: 48px;
      color: var(--primary);
      margin-bottom: 16px;
    }

    .welcome-screen h1 {
      font-size: 24px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .welcome-screen p {
      font-size: 16px;
    }

    /* Сообщения */
    .message {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      width: 100%;
      max-width: 800px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background-color: var(--primary);
      color: white;
    }

    .ai-avatar {
      background-color: #10a37f;
    }

    .message-content {
      flex: 1;
      min-width: 0;
    }

    .message-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .sender-name {
      font-weight: 600;
    }

    .message-time {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .message-text {
      line-height: 1.6;
      word-wrap: break-word;
    }

    .user-message {
      background-color: var(--user-message-bg);
      padding: 12px 16px;
      border-radius: 8px;
    }

    .ai-message {
      background-color: var(--ai-message-bg);
      padding: 12px 16px;
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    /* Индикатор набора текста */
    .typing-indicator {
      display: none;
      gap: 4px;
      padding: 8px 16px;
      align-self: flex-start;
      margin-left: 52px; /* Подстраиваем под отступ аватара */
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      background-color: var(--text-secondary);
      border-radius: 50%;
      animation: typing-animation 1.4s infinite ease-in-out;
    }

    .typing-dot:nth-child(1) { animation-delay: 0s; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing-animation {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-4px); }
    }

    /* Поле ввода */
    .input-container {
      padding: 16px 24px;
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
    }

    .input-box {
      position: relative;
      width: 100%;
      max-width: 800px;
      display: flex;
      align-items: center;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px;
      background-color: var(--bg-color);
      box-shadow: var(--shadow);
    }

    .input-icon-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 18px;
      cursor: pointer;
      padding: 8px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .input-icon-btn:hover {
      background-color: #f0f0f0;
    }

    .message-input {
      flex: 1;
      border: none;
      padding: 8px;
      font-size: 15px;
      resize: none;
      min-height: 24px;
      max-height: 200px;
      outline: none;
      background: transparent;
      color: var(--text-primary);
    }

    .send-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      margin-left: 8px;
    }

    .send-btn:hover {
      background-color: #1a56d6;
    }

    .send-btn:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }

    /* Адаптивность для мобильных */
    @media (max-width: 768px) {
      .sidebar {
        position: absolute;
        z-index: 1000;
        height: 100%;
      }
      
      .chat-header {
        padding: 12px;
      }

      .provider-select {
        max-width: 120px;
      }
    }
  </style>
</head>
<body>

  <!-- Сайдбар (слева) -->
  <div class="sidebar hidden" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <i class="fas fa-robot"></i>
        <span>chat-ai</span>
      </div>
      <button class="input-icon-btn" id="closeSidebarBtn" style="color: var(--text-secondary);">
        <i class="fas fa-times"></i>
      </button>
    </div>
    
    <button class="new-chat-btn" id="newChatBtn">
      <i class="fas fa-plus"></i>
      <span>New Chat</span>
    </button>
    
    <div class="chat-history" id="chatHistory">
      <!-- История чатов будет заполняться через JS, показываем пример -->
      <div class="chat-item-wrapper active">
        <span class="chat-item-text">Как выучить JavaScript?</span>
        <button class="chat-item-menu"><i class="fas fa-ellipsis-h"></i></button>
      </div>
      <div class="chat-item-wrapper">
        <span class="chat-item-text">Python vs JavaScript</span>
        <button class="chat-item-menu"><i class="fas fa-ellipsis-h"></i></button>
      </div>
    </div>
  </div>

  <!-- Основная область справа -->
  <div class="main-content">
    
    <!-- Шапка -->
    <div class="chat-header">
      <div class="chat-header-left">
        <button class="hamburger-btn" id="openSidebarBtn">
          <i class="fas fa-bars"></i>
        </button>
        <div class="chat-title">chat-ai</div>
      </div>
      <div class="chat-header-right">
        <select id="providerSelect" class="provider-select">
          <option value="groq">Groq</option>
          <option value="deepseek">DeepSeek</option>
          <option value="openrouter">OpenRouter</option>
        </select>
        <select id="modelSelect" class="provider-select">
          <!-- Заполняется через JS -->
        </select>
        <button class="input-icon-btn" title="Clear conversation" id="clearChatBtn"><i class="fas fa-trash-alt"></i></button>
        <button class="input-icon-btn" title="Share chat"><i class="fas fa-share"></i></button>
      </div>
    </div>

    <!-- Сообщения -->
    <div class="messages-container" id="messagesContainer">
      <!-- Экран приветствия при пустом чате -->
      <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-icon"><i class="fas fa-robot"></i></div>
        <h1>Здравствуйте!</h1>
        <p>Чем я могу вам помочь?</p>
      </div>
      
      <!-- Индикатор набора текста -->
      <div class="typing-indicator" id="typingIndicator">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    </div>

    <!-- Поле ввода -->
    <div class="input-container">
      <div class="input-box">
        <button class="input-icon-btn" title="Attach file"><i class="fas fa-paperclip"></i></button>
        <textarea class="message-input" id="messageInput" placeholder="Message chat-ai..." rows="1"></textarea>
        <button class="input-icon-btn" title="Voice input"><i class="fas fa-microphone"></i></button>
        <button class="send-btn" id="sendButton" disabled>
          <i class="fas fa-paper-plane"></i>
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html-docx-js/dist/html-docx.js"></script>
  <script src="script.js"></script>
</body>
</html>
